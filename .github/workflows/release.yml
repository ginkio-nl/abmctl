name: Release

# Pushing a tag like v1.2.3 publishes a GitHub release with a universal macOS
# binary, abmctl_1.2.3_darwin_universal (PIT Pro's Addigy pipeline downloads it),
# plus Linux and Windows binaries and a checksums.txt.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          tag=${GITHUB_REF_NAME}
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$tag" -o "abmctl-$arch" .
          done
          bin="abmctl_${tag#v}_darwin_universal"
          lipo -create -output "$bin" abmctl-amd64 abmctl-arm64
          codesign --force --sign - --identifier abmctl "$bin"
          "./$bin" --version
          mkdir dist
          mv "$bin" dist/
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            out="dist/abmctl_${tag#v}_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$tag" -o "$out" .
          done
          (cd dist && shasum -a 256 * >checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
